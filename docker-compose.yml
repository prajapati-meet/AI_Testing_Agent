version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-test-agent-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docs/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    restart: unless-stopped
